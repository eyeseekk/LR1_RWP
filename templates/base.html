<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>
        {% if title %}{{ title }}{% else %}Лабораторная работа №1{% endif %}
    </title>
  </head>
  <body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="{{ url_for('index') }}">Лабораторная работа № 1</a>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Задание</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('posts') }}">Посты</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">Об авторе</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="my-3">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="bg-dark text-white mt-5 py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <p class="mb-0">&copy; Выполнил: Карсаев Айс, группа 241-326</p>
                    <p class="mb-0 small text-muted">Лабораторная работа №1 по дисциплине "Разработка веб-приложений"</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
  </body>
</html>
